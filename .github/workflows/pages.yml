name: Publish GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          node --check app.js
          node --input-type=module --check < firebase-cloud.js
      - uses: actions/configure-pages@v5
      - name: Prepare public files only
        run: |
          mkdir -p public/assets
          cp index.html styles.css app.js firebase-cloud.js runtime-config.js public/
          cp assets/favicon.svg public/assets/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
